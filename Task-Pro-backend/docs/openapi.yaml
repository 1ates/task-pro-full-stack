openapi: 3.0.3
info:
  title: TaskPro API
  version: 1.0.0
  description: REST API for the TaskPro task management application
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:3000/api
  - url: Local development server
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Authentication and user profile management.
  - name: Boards
    description: Boards management.
  - name: Columns
    description: Columns management.
  - name: Cards
    description: Cards management.
  - name: Help
    description: Need help requests.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: 64f123456789abcdef123456
        name:
          type: string
          example: Ateş
        email:
          type: string
          format: email
          example: user@example.com
        avatarURL:
          type: string
          nullable: true
          example: https://res.cloudinary.com/example/image/upload/avatar.jpg
        theme:
          type: string
          enum:
            - light
            - dark
            - violet
          example: dark
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 32
          example: Ateş
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          maxLength: 64
          example: StrongPassword123!
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          example: StrongPassword123!
    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    GoogleAuthRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          example: 4/0AbCdEf...
    UpdateThemeRequest:
      type: object
      required:
        - theme
      properties:
        theme:
          type: string
          enum:
            - light
            - dark
            - violet
          example: violet
    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 32
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 64
        avatar:
          type: string
          format: binary
    Board:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        icon:
          type: string
        background:
          type: string
          nullable: true
        owner:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BoardInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 64
        icon:
          type: string
        background:
          type: string
          nullable: true
    Column:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        boardId:
          type: string
        owner:
          type: string
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
    ColumnInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 64
    Card:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum:
            - without
            - low
            - medium
            - high
        deadline:
          type: string
          format: date-time
        columnId:
          type: string
        boardId:
          type: string
        owner:
          type: string
    CardInput:
      type: object
      required:
        - title
        - description
        - deadline
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          minLength: 1
          maxLength: 2048
        priority:
          type: string
          enum:
            - without
            - low
            - medium
            - high
        deadline:
          type: string
          format: date-time
    MoveCardRequest:
      type: object
      required:
        - columnId
      properties:
        columnId:
          type: string
    ApiUserResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
        data:
          $ref: '#/components/schemas/User'
    AuthData:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
        refreshToken:
          type: string
    AuthResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/AuthData'
    BoardResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/Board'
    BoardDetails:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        icon:
          type: string
        background:
          type: string
          nullable: true
        owner:
          type: string
        columns:
          type: array
          items:
            $ref: '#/components/schemas/Column'
    BoardDetailsResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/BoardDetails'
    BoardsResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Board'
    ColumnResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/Column'
    CardResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/Card'
    EmptyResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        data:
          type: object
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: Bad Request
        errors:
          type: array
          items:
            type: object
paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      tags:
        - Auth
      summary: Log in
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid email or password
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access and refresh tokens
      operationId: refreshTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired refresh token
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Log out
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logged out successfully
        '401':
          description: Not authorized
  /auth/current:
    get:
      tags:
        - Auth
      summary: Get current user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUserResponse'
        '401':
          description: Not authorized
  /auth/me:
    patch:
      tags:
        - Auth
      summary: Update user profile
      operationId: updateUserProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUserResponse'
        '400':
          description: Invalid profile data
        '401':
          description: Not authorized
        '409':
          description: Email already exists
  /auth/theme:
    patch:
      tags:
        - Auth
      summary: Update user theme
      operationId: updateUserTheme
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateThemeRequest'
      responses:
        '200':
          description: Theme updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUserResponse'
        '401':
          description: Not authorized
  /auth/request-reset-email:
    post:
      tags:
        - Auth
      summary: Request a password reset email
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset request processed
        '400':
          description: Invalid email
  /auth/reset-password:
    post:
      tags:
        - Auth
      summary: Reset password
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
                - token
              properties:
                password:
                  type: string
                  minLength: 8
                  maxLength: 64
                token:
                  type: string
      responses:
        '200':
          description: Password reset successfully
        '401':
          description: Invalid or expired reset token
  /auth/get-oauth-url:
    get:
      tags:
        - Auth
      summary: Get Google OAuth URL
      operationId: getGoogleOAuthUrl
      security: []
      responses:
        '200':
          description: Google OAuth URL generated
        '400':
          description: Failed to generate Google OAuth URL
  /auth/confirm-google-auth:
    post:
      tags:
        - Auth
      summary: Complete Google OAuth login
      operationId: confirmGoogleAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
      responses:
        '200':
          description: Google login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Google authentication failed
  /boards:
    get:
      tags:
        - Boards
      summary: Get all boards
      operationId: getBoards
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Boards retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardsResponse'
        '401':
          description: Not authorized
    post:
      tags:
        - Boards
      summary: Create a board
      operationId: createBoard
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardInput'
      responses:
        '201':
          description: Board created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardResponse'
        '400':
          description: Invalid board data
        '401':
          description: Not authorized
  /boards/{boardId}:
    parameters:
      - name: boardId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Boards
      summary: Get a board with columns and cards
      operationId: getBoard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Board retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardDetailsResponse'
        '401':
          description: Not authorized
        '404':
          description: Board not found
    patch:
      tags:
        - Boards
      summary: Update a board
      operationId: updateBoard
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardInput'
      responses:
        '200':
          description: Board updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardResponse'
        '401':
          description: Not authorized
        '404':
          description: Board not found
    delete:
      tags:
        - Boards
      summary: Delete a board
      operationId: deleteBoard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Board deleted
        '401':
          description: Not authorized
        '404':
          description: Board not found
  /boards/{boardId}/background:
    parameters:
      - name: boardId
        in: path
        required: true
        schema:
          type: string
    patch:
      tags:
        - Boards
      summary: Upload a board background image
      operationId: updateBoardBackground
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - background
              properties:
                background:
                  type: string
                  format: binary
      responses:
        '200':
          description: Board background updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardResponse'
        '400':
          description: Background image is required
        '401':
          description: Not authorized
        '404':
          description: Board not found
  /boards/{boardId}/columns:
    parameters:
      - name: boardId
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - Columns
      summary: Create a column in a board
      operationId: createColumn
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnInput'
      responses:
        '201':
          description: Column created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnResponse'
        '401':
          description: Not authorized
        '404':
          description: Board not found
  /columns/{columnId}:
    parameters:
      - name: columnId
        in: path
        required: true
        schema:
          type: string
    patch:
      tags:
        - Columns
      summary: Update a column
      operationId: updateColumn
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnInput'
      responses:
        '200':
          description: Column updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnResponse'
        '401':
          description: Not authorized
        '404':
          description: Column not found
    delete:
      tags:
        - Columns
      summary: Delete a column and its cards
      operationId: deleteColumn
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Column deleted
        '401':
          description: Not authorized
        '404':
          description: Column not found
  /columns/{columnId}/cards:
    parameters:
      - name: columnId
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - Cards
      summary: Create a card in a column
      operationId: createCard
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardInput'
      responses:
        '201':
          description: Card created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '401':
          description: Not authorized
        '404':
          description: Column not found
  /cards/{cardId}:
    parameters:
      - name: cardId
        in: path
        required: true
        schema:
          type: string
    patch:
      tags:
        - Cards
      summary: Update a card
      operationId: updateCard
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardInput'
      responses:
        '200':
          description: Card updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '401':
          description: Not authorized
        '404':
          description: Card not found
    delete:
      tags:
        - Cards
      summary: Delete a card
      operationId: deleteCard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Card deleted
        '401':
          description: Not authorized
        '404':
          description: Card not found
  /cards/{cardId}/move:
    parameters:
      - name: cardId
        in: path
        required: true
        schema:
          type: string
    patch:
      tags:
        - Cards
      summary: Move a card to another column
      operationId: moveCard
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveCardRequest'
      responses:
        '200':
          description: Card moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '401':
          description: Not authorized
        '404':
          description: Card or column not found
  /help:
    post:
      tags:
        - Help
      summary: Send a help request
      operationId: sendHelpRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - comment
              properties:
                email:
                  type: string
                  format: email
                comment:
                  type: string
                  minLength: 1
                  maxLength: 2048
      responses:
        '200':
          description: Help request sent
        '400':
          description: Invalid help request
        '401':
          description: Not authorized
